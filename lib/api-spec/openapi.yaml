openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Administrator operations
paths:
  /sabito/settings:
    get:
      operationId: getSabitoVisibility
      summary: Public Sabito visibility flag, never cached
      responses:
        "200":
          description: Visibility for visitors and members
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
        "503":
          description: Settings unavailable; widget must remain hidden
  /admin/sabito/settings:
    put:
      operationId: setSabitoVisibility
      summary: Enable or disable Sabito, authenticated administrators only
      description: Requires the existing session cookie, same Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Persisted visibility flag
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
        "400":
          description: Invalid flag
        "401":
          description: Authentication required
        "403":
          description: Administrator required or origin rejected
        "503":
          description: Could not persist settings
  /sabito/session:
    post:
      operationId: createSabitoMemberSession
      summary: Create a short-lived Sabito session for the authenticated member
      description: |
        Requires the existing bb_session cookie, a matching Origin header and
        application/json. Identity is derived exclusively from the server
        session. Responses must not be cached. No visitor fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "200":
          description: Validated member session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [access_token, expires_in, socket_path, external_user_id]
                properties:
                  access_token:
                    type: string
                    minLength: 1
                  expires_in:
                    type: integer
                    minimum: 1
                    maximum: 900
                  socket_path:
                    type: string
                  external_user_id:
                    type: string
                    minLength: 1
                    maxLength: 191
        "400":
          description: Invalid request body
        "401":
          description: Missing, expired or revoked Buzz Booster session
        "403":
          description: Origin rejected
        "415":
          description: JSON required
        "429":
          description: Too many attempts for this member
        "502":
          description: Invalid or failed upstream exchange
        "503":
          description: Sabito unavailable or server configuration missing
        "504":
          description: Upstream timeout
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /email-banner:
    get:
      operationId: getEmailBanner
      tags: [notifications]
      summary: Read the public email availability banner
      responses:
        "200":
          description: Banner state and message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailBannerResponse"
  /admin/email-banner:
    get:
      operationId: getAdminEmailBanner
      tags: [notifications]
      summary: Read email banner settings
      responses:
        "200":
          description: Current banner settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailBannerResponse"
    put:
      operationId: updateAdminEmailBanner
      tags: [notifications]
      summary: Update email banner settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailBannerUpdate"
      responses:
        "200":
          description: Updated banner settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailBannerResponse"
        "400":
          description: Invalid banner settings
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/afribapay/deposits:
    get:
      operationId: listAdminAfribapayDeposits
      tags: [admin]
      summary: List successful AfribaPAY deposits and exact net totals
      parameters:
        - name: from
          in: query
          description: Inclusive start date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive end date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: currency
          in: query
          schema:
            type: string
            pattern: "^[A-Za-z]{3,8}$"
        - name: country
          in: query
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
        - name: operator
          in: query
          schema:
            type: string
            maxLength: 80
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Successful AfribaPAY deposits, exact per-currency totals, and filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAfribapayDepositsResponse"
        "400":
          description: Invalid filters
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/afribapay/deposits/{payment_id}/provider-preview:
    get:
      operationId: getAdminAfribapayProviderPreview
      tags: [admin]
      summary: Read actual provider fields for one completed AfribaPAY deposit
      description: Queries AfribaPAY without changing the local payment record and returns only status and amount fields.
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Sanitized amount fields returned by AfribaPAY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAfribapayProviderPreview"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "400":
          description: Invalid payment identifier
        "404":
          description: AfribaPAY payment not found
        "409":
          description: Payment is not completed or has no provider reference
        "429":
          description: AfribaPAY or the local safeguard is rate limiting the lookup
        "502":
          description: AfribaPAY lookup failed
        "503":
          description: AfribaPAY is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EmailBanner:
      type: object
      properties:
        active:
          type: boolean
        message:
          type: string
          maxLength: 500
      required: [active, message]
    EmailBannerResponse:
      type: object
      properties:
        emailBanner:
          $ref: "#/components/schemas/EmailBanner"
      required: [emailBanner]
    EmailBannerUpdate:
      type: object
      properties:
        active:
          type: boolean
        message:
          type: string
          maxLength: 500
      required: [active, message]
    AdminAfribapayDeposit:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        user_label:
          type: string
        user_email:
          type: [string, "null"]
        phone_number:
          type: [string, "null"]
        reference:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        country:
          type: [string, "null"]
        operator:
          type: [string, "null"]
        currency:
          type: string
        amount_minor:
          type: string
        charged_minor:
          type: [string, "null"]
        provider_fee_minor:
          type: [string, "null"]
        provider_tax_minor:
          type: [string, "null"]
        provider_fee_total_minor:
          type: [string, "null"]
        net_minor:
          type: [string, "null"]
      required:
        - id
        - user_id
        - user_label
        - user_email
        - phone_number
        - reference
        - created_at
        - country
        - operator
        - currency
        - amount_minor
        - charged_minor
        - provider_fee_minor
        - provider_tax_minor
        - provider_fee_total_minor
        - net_minor
    AdminAfribapayCurrencySummary:
      type: object
      properties:
        currency:
          type: string
        deposit_count:
          type: integer
        known_count:
          type: integer
        unknown_count:
          type: integer
        gross_minor:
          type: string
        fees_minor:
          type: string
        net_minor:
          type: string
      required:
        - currency
        - deposit_count
        - known_count
        - unknown_count
        - gross_minor
        - fees_minor
        - net_minor
    AdminAfribapayProviderPreview:
      type: object
      properties:
        status:
          type: string
        amount:
          type: [number, "null"]
        fees:
          type: [number, "null"]
        taxes:
          type: [number, "null"]
        fees_taxes_ttc:
          type: [number, "null"]
        amount_total:
          type: [number, "null"]
        currency:
          type: [string, "null"]
        lookup_method:
          type: string
          enum: [order_id, transaction_id]
      required:
        - status
        - amount
        - fees
        - taxes
        - fees_taxes_ttc
        - amount_total
        - currency
        - lookup_method
    AdminAfribapayDepositsResponse:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AdminAfribapayDeposit"
        total_count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        summary:
          type: array
          items:
            $ref: "#/components/schemas/AdminAfribapayCurrencySummary"
        filters:
          type: object
          properties:
            currencies:
              type: array
              items:
                type: string
            countries:
              type: array
              items:
                type: string
            operators:
              type: array
              items:
                type: string
          required: [currencies, countries, operators]
      required: [rows, total_count, limit, offset, summary, filters]

